name: Развернуть на GitHub Pages

on:
  push:
    branches: [main]
  # Кнопка ручного запуска: пересобрать без коммита (например, после смены ключей).
  workflow_dispatch:

# Токену нужно ровно это: прочитать репозиторий и опубликовать страницу.
permissions:
  contents: read
  pages: write
  id-token: write

# Две сборки подряд не толкаются: свежая ждёт, пока предыдущая доедет.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npx vitest run

      - name: Сборка
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # Pages отдаёт 404.html на любой неизвестный путь. Копия index.html в этой
      # роли возвращает управление роутеру: /predel/session/:id открывается по
      # прямой ссылке и после перезагрузки, а не показывает страницу ошибки.
      - name: Заглушка для клиентского роутинга
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
